<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects — DM Web UI Kit</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../tokens/dm_tokens.css" />
    <link rel="stylesheet" href="../tokens/dm_typography_web_tokens.css" />
    <link rel="stylesheet" href="../styles/css/main.css" />
  </head>
  <body>
    <div class="notes-layout">
      <nav class="notes-nav" aria-label="Projects">
        <div class="site-switch">
          <a class="btn btn-quaternary-neutral btn--sm btn--icon-only" href="../" aria-label="Library" aria-describedby="site-switch-library"><span class="icon icon--book-closed" aria-hidden="true"></span></a>
          <a class="btn btn-quaternary-neutral btn--sm btn--icon-only" href="../experiments/" aria-label="Experiments" aria-describedby="site-switch-experiments"><span class="icon icon--tubes" aria-hidden="true"></span></a>
          <a class="btn btn-neutral btn--sm btn--icon-only" href="./" aria-label="Projects" aria-describedby="site-switch-projects" aria-current="page"><span class="icon icon--flow" aria-hidden="true"></span></a>
          <div class="tooltip" id="site-switch-library" role="tooltip" popover="manual" data-placement="bottom">Library</div>
          <div class="tooltip" id="site-switch-experiments" role="tooltip" popover="manual" data-placement="bottom">Experiments</div>
          <div class="tooltip" id="site-switch-projects" role="tooltip" popover="manual" data-placement="bottom">Projects</div>
        </div>
        <a class="demo-nav__logo" href="./">
          <img src="../assets/images/logo-dailymail.svg" alt="Daily Mail" width="140" height="29" />
          <span class="demo-nav__strapline">Projects</span>
        </a>

        <p class="notes-nav__heading" id="notes-year-label">Year</p>
        <ul class="notes-nav__menu" id="notes-year" aria-labelledby="notes-year-label"></ul>
      </nav>

      <main class="notes-main">
        <h1 class="notes-main__title">Projects</h1>
        <div id="notes-list"></div>
        <footer class="demo-footer">© 2026 Joungmin Shin · Contact: <a href="mailto:joungmin.shin@dmgmedia.co.uk">joungmin.shin@dmgmedia.co.uk</a></footer>
      </main>
    </div>

    <script src="../scripts/modules/tooltip.js" defer></script>
    <script src="../scripts/scaffolding/notes-index.js"></script>
    <script>
      // ── Project notes ───────────────────────────────────────────────────────
      // One entry per project, newest first. Claude Code adds or updates the
      // entry whenever it creates or changes files in projects/ (CLAUDE.md ›
      // Projects). Page and cards: scripts/scaffolding/notes-index.js +
      // styles/scss/scaffolding/_notes-index.scss. The year menu is built from `date`.
      //
      //   id       folder name (YYYYMM-prj-<name>)
      //   date     'YYYY-MM-DD' — when the project started
      //   title    short name
      //   status   'In progress' | 'Done' | 'Archived'
      //   notes    short lines, not prose: what is built, then one line per later change (dated)
      //   result   outcome, once there is one
      //   pages    [label, file in the folder, one-line description]
      const PROJECTS = [
      ];

      renderNotesIndex(PROJECTS);
    </script>
  </body>
</html>
