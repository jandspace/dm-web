    <script src="../scripts/scaffolding/notes-index.js"></script>
    <script>
      // ── Project notes ───────────────────────────────────────────────────────
      // One entry per project, newest first. Claude Code adds or updates the
      // entry whenever it creates or changes files in projects/ (CLAUDE.md ›
      // Projects). Page and cards: scripts/scaffolding/notes-index.js +
      // styles/scss/scaffolding/_notes-index.scss. The year menu is built from `date`.
      //
      //   id       folder name (YYYYMM-prj-<name>)
      //   date     'YYYY-MM-DD' — when the project started
      //   title    short name
      //   status   'In progress' | 'Done' | 'Archived'
      //   notes    short lines, not prose: what is built, then one line per later change (dated)
      //   result   outcome, once there is one
      //   pages    [label, file in the folder, one-line description]
      const PROJECTS = [
        {
          id: '202611-prj-homepage',
          date: '2026-11-03',
          title: 'Homepage — page frame',
          status: 'In progress',
          notes: [
            'DM homepage built from the library, one content block at a time.',
            'Frame from Figma 8709:88370: Billboard › Masthead › Sticky Navbar › Navbar L2 › 3 empty sections › Footer.',
            'All breakpoints (XS–XL), no viewport switch. Billboard MD 728×90 / LG 970×250 · Side Ads ≥1350 · mobile bottom bar <MD.',
            'Side Ads: start 29px under the masthead top, stick at 64px, stop at the footer. 8px from the container (doc; Figma 0).',
            'Sections: .homepage-slot placeholders. Styles: _prj-homepage.scss · behaviour: scripts/modules/masthead.js.',
            '2026-11-03 — Masthead keylines (library): 16px inset, border/translucent-dark/pale.',
            '2026-11-03 — Main page moved from web/ to the project folder.',
            '2026-11-03 — Footer → shared page-footer.js (reveal underlay).',
            '2026-11-04 — Navbar L2 (Home subchannels) as first child of <main>; page container moved inside <main>. Side Ads lift 185 (masthead 154 + L2 60 − 29).',
            '2026-11-03 — Mouse drag = swipe on sideways rows (demo-drag-swipe.js).',
          ],
          result: '',
          pages: [['Homepage', 'index.html', 'Empty page frame, all breakpoints.']],
        },
      ];

      renderNotesIndex(PROJECTS);
    </script>
  </body>
</html>
